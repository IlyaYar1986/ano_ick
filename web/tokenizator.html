<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализатор Токенизации</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --primary: #6366f1;
            --text: #1e293b;
            --border: #e2e8f0;
            --token-bg: #eff6ff;
            --token-border: #bfdbfe;
            --token-text: #1e40af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        
        .input-box {
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--primary); }

        .tabs {
            display: flex;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
            gap: 5px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            user-select: none;
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .output {
            min-height: 150px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            background: #fafafa;
        }

        .token {
            padding: 4px 10px;
            background: var(--token-bg);
            border: 1px solid var(--token-border);
            color: var(--token-text);
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .stat-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-val {
            display: block;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; }
    </style>
    <link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="card">
    <h1>Визуализатор Токенизации</h1>
    
    <div class="input-box">
        <textarea id="textInput" placeholder="Введите текст...">Нейросети разбирают сложные слова на части.</textarea>
    </div>

    <div class="tabs">
        <div class="tab" onclick="setMode('word')" id="tab-word">По словам</div>
        <div class="tab" onclick="setMode('char')" id="tab-char">По буквам</div>
        <div class="tab active" onclick="setMode('token')" id="tab-token">Токены (Subword)</div>
    </div>

    <div class="output" id="output"></div>

    <div class="stats">
        <div class="stat-item">
            <span class="stat-val" id="count">0</span>
            <span class="stat-label">Длина последовательности</span>
        </div>
        <div class="stat-item">
            <span class="stat-val" id="vocab">Средний</span>
            <span class="stat-label">Размер словаря модели</span>
        </div>
    </div>
</div>

<script>
    let mode = 'token';
    const input = document.getElementById('textInput');
    const output = document.getElementById('output');
    const countEl = document.getElementById('count');
    const vocabEl = document.getElementById('vocab');

    // Список окончаний/суффиксов для симуляции BPE в русском языке
    const suffixes = ['ируют', 'ован', 'ние', 'ные', 'ого', 'ную', 'ает', 'ия', 'ках', 'ами', 'ный', 'ой', 'ти', 'ут', 'ят'];

    function setMode(newMode) {
        mode = newMode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${newMode}`).classList.add('active');
        render();
    }

    function tokenize(text) {
        if (mode === 'word') {
            return text.split(/(\s+)/).filter(s => s !== '');
        }
        
        if (mode === 'char') {
            return text.split('');
        }

        // Симуляция сабворд-токенизации (упрощенная)
        const words = text.split(/(\s+)/);
        let result = [];
        
        words.forEach(word => {
            if (word.trim() === '') {
                result.push(word);
                return;
            }
            
            let foundSuffix = false;
            for (let s of suffixes) {
                if (word.length > s.length + 2 && word.endsWith(s)) {
                    result.push(word.slice(0, -s.length));
                    result.push(s);
                    foundSuffix = true;
                    break;
                }
            }
            
            if (!foundSuffix) {
                // Если длинное слово без суффикса, делим пополам для наглядности
                if (word.length > 10) {
                    const mid = Math.floor(word.length / 2);
                    result.push(word.slice(0, mid));
                    result.push(word.slice(mid));
                } else {
                    result.push(word);
                }
            }
        });
        return result;
    }

    function render() {
        const text = input.value;
        const tokens = tokenize(text);
        
        output.innerHTML = '';
        tokens.forEach(t => {
            const div = document.createElement('div');
            div.className = 'token';
            div.textContent = t === ' ' ? '␣' : t;
            output.appendChild(div);
        });

        countEl.textContent = tokens.length;
        
        // Оценка словаря
        if (mode === 'word') vocabEl.textContent = 'Огромный (>1 млн)';
        else if (mode === 'char') vocabEl.textContent = 'Крошечный (~200)';
        else vocabEl.textContent = 'Оптимальный (~50к)';
    }

    input.addEventListener('input', render);
    render(); // Начальный запуск
</script>

</body>
</html>
